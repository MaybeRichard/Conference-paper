name: M2A Lexical Retrieval

on:
  push:
    branches: [feat/research-agent-m2a-lexical]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Original corpus and complete Python tests
        run: |
          node --test tests/conference-corpus.test.mjs
          python -m pytest tests/agent -q -ra
          python -m compileall -q research_agent
      - name: Source and wheel build and content audit
        run: |
          python -m build
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel, = Path('dist').glob('*.whl')
          with ZipFile(wheel) as z:
              assert not any(any(t in n for t in ['corpus/', 'workspaces/', 'cache/', 'tests/', '.env', '.pdf']) for n in z.namelist())
              assert 'research_agent/retrieval/search.py' in z.namelist()
              print('wheel entries:', len(z.namelist()))
          PY
      - name: Real snapshot build, query and missing-abstract calibration
        run: python tools/m2a_smoke.py --repo "$PWD" --out "$RUNNER_TEMP/m2a-evidence"
      - name: Isolated installed-wheel tests without source package on import path
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          WP="$RUNNER_TEMP/wheel-env/bin/python"
          "$WP" -m pip install dist/*.whl pytest
          mkdir "$RUNNER_TEMP/wheel-tests"
          cp -R tests domains "$RUNNER_TEMP/wheel-tests/"
          cp pyproject.toml "$RUNNER_TEMP/wheel-tests/"
          export RESEARCH_AGENT_CORPUS_ROOT="$PWD"
          cd "$RUNNER_TEMP/wheel-tests"
          unset PYTHONPATH
          "$WP" -c 'import research_agent; print(research_agent.__file__); assert "site-packages" in research_agent.__file__'
          "$WP" -m pytest tests/agent -q -ra
      - name: Protected assets and clean checkout
        run: |
          git fetch --no-tags --depth=1 origin 3c712fb722ca9fc2268a88eebd9f6a14e8a898f1
          git diff --exit-code 3c712fb722ca9fc2268a88eebd9f6a14e8a898f1 -- corpus scripts DATASET_MANIFEST.json DATA_NOTICE.md tests/conference-corpus.test.mjs
          git diff --check
          test -z "$(git status --short)"
          git rev-parse HEAD > "$RUNNER_TEMP/m2a-evidence/source-commit.txt"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: m2a-evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/m2a-evidence/
            dist/*.whl
          retention-days: 7
