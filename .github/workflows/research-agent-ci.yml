name: Research Agent CI

on:
  push:
    branches:
      - feat/research-agent-m1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Verify corpus inventory
        run: node --test tests/conference-corpus.test.mjs

      - name: Run Python tests
        run: python -m pytest tests/agent -q -ra

      - name: Compile Python package
        run: python -m compileall -q research_agent
