name: Research Agent CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-agent-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Verify corpus inventory
        run: node --test tests/conference-corpus.test.mjs

      - name: Run fixture and unit tests
        run: python -m pytest tests/agent -q -ra -m 'not real_corpus'

      - name: Run real corpus integration test
        run: python -m pytest tests/agent -q -ra -m real_corpus

      - name: Compile Python package
        run: python -m compileall -q research_agent

      - name: Build source and wheel distributions
        run: python -m build

      - name: Verify wheel contains code only
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              names = archive.namelist()
          forbidden = ("corpus/", "workspaces/", "cache/", ".env", ".pdf", "tests/")
          unexpected = [
              name for name in names
              if any(fragment in name for fragment in forbidden)
          ]
          assert not unexpected, unexpected
          assert "research_agent/api.py" in names
          assert "research_agent/cli.py" in names
          print(f"verified wheel entries: {len(names)}")
          PY

      - name: Smoke test the real M1 CLI boundary
        run: |
          research-agent --repo . --json corpus verify > /tmp/m1-corpus.json
          research-agent --repo . --json workspace create \
            --domain medical_diffusion_2d \
            --topic '二维医学图像扩散生成' > /tmp/m1-workspace.json
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          corpus = json.loads(Path("/tmp/m1-corpus.json").read_text(encoding="utf-8"))
          assert corpus["paper_count"] == 113989
          assert corpus["release_count"] == 86
          created = json.loads(Path("/tmp/m1-workspace.json").read_text(encoding="utf-8"))
          assert created["stage"] == "G1"
          assert created["status"] == "waiting_for_user"
          workspace_id = created["workspace_id"]
          status = subprocess.run(
              [
                  "research-agent", "--repo", ".", "--json",
                  "status", workspace_id,
              ],
              capture_output=True,
              text=True,
              check=False,
          )
          assert status.returncode == 0, status.stderr
          assert json.loads(status.stdout) == created
          waiting = subprocess.run(
              [
                  "research-agent", "--repo", ".", "--json",
                  "run", workspace_id, "--until", "next-gate",
              ],
              capture_output=True,
              text=True,
              check=False,
          )
          assert waiting.returncode == 0, waiting.stderr
          assert json.loads(waiting.stdout)["status"] == "waiting_for_user"
          PY

      - name: Re-run the suite from the locked environment
        run: |
          python -m venv /tmp/research-agent-m1-lock
          LOCK_PY=/tmp/research-agent-m1-lock/bin/python
          "$LOCK_PY" -m pip install -r requirements-dev.lock
          "$LOCK_PY" -m pip install --no-deps -e .
          "$LOCK_PY" -m pytest tests/agent -q -ra

      - name: Verify protected repository assets are unchanged
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --exit-code "$BASE_SHA" -- \
            corpus \
            scripts \
            DATASET_MANIFEST.json \
            DATA_NOTICE.md \
            tests/conference-corpus.test.mjs
          git diff --check
          test -z "$(git status --short)"

  macos_acceptance:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e '.[dev]'

      - name: Verify corpus inventory
        run: node --test tests/conference-corpus.test.mjs

      - name: Run complete Python test suite
        run: python -m pytest tests/agent -q -ra

      - name: Compile Python package
        run: python -m compileall -q research_agent

      - name: Build source and wheel distributions
        run: python -m build

      - name: Verify wheel contains code only
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              names = archive.namelist()
          forbidden = ("corpus/", "workspaces/", "cache/", ".env", ".pdf", "tests/")
          unexpected = [
              name for name in names
              if any(fragment in name for fragment in forbidden)
          ]
          assert not unexpected, unexpected
          assert "research_agent/api.py" in names
          assert "research_agent/cli.py" in names
          print(f"verified wheel entries: {len(names)}")
          PY

      - name: Verify corpus and create Workspace
        run: |
          research-agent --repo . --json corpus verify > /tmp/m1-macos-corpus.json
          research-agent --repo . --json workspace create             --domain medical_diffusion_2d             --topic '二维医学图像扩散生成' > /tmp/m1-macos-workspace.json
          python - <<'PY'
          import json
          from pathlib import Path

          corpus = json.loads(Path("/tmp/m1-macos-corpus.json").read_text(encoding="utf-8"))
          assert corpus["snapshot_id"] == "snapshot_a6ef56370e3258f5"
          assert corpus["paper_count"] == 113989
          assert corpus["release_count"] == 86
          assert corpus["verified_files"] == 173

          created = json.loads(Path("/tmp/m1-macos-workspace.json").read_text(encoding="utf-8"))
          assert created["stage"] == "G1"
          assert created["status"] == "waiting_for_user"
          Path("/tmp/m1-macos-ws.txt").write_text(created["workspace_id"], encoding="utf-8")
          print(json.dumps(created, ensure_ascii=False, sort_keys=True))
          PY

      - name: Review and approve G1
        run: |
          WS=$(cat /tmp/m1-macos-ws.txt)
          research-agent --repo . --json gate show "$WS" > /tmp/m1-macos-gate.json
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          gate = json.loads(Path("/tmp/m1-macos-gate.json").read_text(encoding="utf-8"))["pending_gate"]
          decision = {
              "request_id": "m1_macos_g1_approval_001",
              "gate_id": gate["gate_id"],
              "artifact": gate["artifact"],
              "actor": "user",
              "action": "approve",
          }
          Path("/tmp/m1-macos-g1-decision.yaml").write_text(
              yaml.safe_dump(decision, allow_unicode=True, sort_keys=False),
              encoding="utf-8",
          )
          print(Path("/tmp/m1-macos-g1-decision.yaml").read_text(encoding="utf-8"))
          PY
          research-agent --repo . --json gate approve "$WS"             --decision /tmp/m1-macos-g1-decision.yaml > /tmp/m1-macos-approved.json
          python - <<'PY'
          import json
          from pathlib import Path

          approved = json.loads(Path("/tmp/m1-macos-approved.json").read_text(encoding="utf-8"))
          assert approved["stage"] == "S2"
          assert approved["status"] == "not_started"
          assert approved["pending_gate"] is None
          print(json.dumps(approved, ensure_ascii=False, sort_keys=True))
          PY

      - name: Verify cross-process status, validation, events, and honest S2 block
        run: |
          WS=$(cat /tmp/m1-macos-ws.txt)
          research-agent --repo . --json status "$WS" > /tmp/m1-macos-status.json
          research-agent --repo . --json validate "$WS" > /tmp/m1-macos-validate.json
          research-agent --repo . --json events "$WS" > /tmp/m1-macos-events.json
          set +e
          research-agent --repo . --json run "$WS" --until next-gate > /tmp/m1-macos-run.json
          RUN_EXIT=$?
          set -e
          python - <<PY
          import json
          from pathlib import Path

          status = json.loads(Path("/tmp/m1-macos-status.json").read_text(encoding="utf-8"))
          assert status["stage"] == "S2"
          assert status["status"] == "not_started"

          validation = json.loads(Path("/tmp/m1-macos-validate.json").read_text(encoding="utf-8"))
          assert validation["valid"] is True
          assert not validation["errors"]

          events = json.loads(Path("/tmp/m1-macos-events.json").read_text(encoding="utf-8"))
          event_types = {
              event["payload"].get("type")
              for event in events["events"]
              if isinstance(event.get("payload"), dict)
          }
          assert {"WorkspaceCreated", "GateOpened", "GateApproved"} <= event_types

          run = json.loads(Path("/tmp/m1-macos-run.json").read_text(encoding="utf-8"))
          assert run["stage"] == "S2"
          assert run["status"] == "blocked"
          assert run["reason"] == "stage_handler_not_installed"
          assert run["new_artifacts"] == []
          assert $RUN_EXIT == 5

          print("status: S2 / not_started")
          print("validate: valid=true")
          print("events: WorkspaceCreated, GateOpened, GateApproved")
          print("run: S2 / blocked / stage_handler_not_installed")
          print("run exit code: $RUN_EXIT")
          PY

      - name: Verify clean repository state
        run: |
          git diff --check
          test -z "$(git status --short)"
